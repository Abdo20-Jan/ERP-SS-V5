version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sunset-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_dev_password
      POSTGRES_DB: sunset_erp
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/prisma/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d sunset_erp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sunset-erp-network

  postgres-test:
    image: postgres:16-alpine
    container_name: sunset-erp-postgres-test
    restart: "no"
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_test_password
      POSTGRES_DB: sunset_erp_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - sunset-erp-network
    profiles:
      - test

volumes:
  postgres_data:
    driver: local

networks:
  sunset-erp-network:
    driver: bridge
