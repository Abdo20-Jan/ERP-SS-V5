name: opencode-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  issues: read
jobs:
  governed-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_MODEL_REVIEWER: ${{ vars.OPENCODE_MODEL_REVIEWER }}
          # Add only the provider secret required by the selected model.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ vars.OPENCODE_MODEL_REVIEWER }}
          use_github_token: true
          prompt: |
            Review this PR against AGENTS.md, the active slice/controller, approved requirements, security, tests and traceability.
            Do not modify code. Report only evidence-backed findings with severity, file/line and merge status.
